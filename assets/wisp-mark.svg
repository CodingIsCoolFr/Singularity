<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Wisp">
  <title>Wisp</title>

  <defs>
    <linearGradient id="mRing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7d8" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#8aa4ff" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="mDisk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7d8" stop-opacity="0.12"/>
      <stop offset="0.3" stop-color="#9af3e6" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#eef4fb"/>
      <stop offset="0.8" stop-color="#e0b35c" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#6ee7d8" stop-opacity="0.12"/>
    </linearGradient>

    <radialGradient id="mHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#6ee7d8" stop-opacity="0.34"/>
      <stop offset="0.78" stop-color="#6ee7d8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#6ee7d8" stop-opacity="0"/>
    </radialGradient>

    <mask id="mBehind">
      <rect width="256" height="256" fill="white"/>
      <circle cx="128" cy="128" r="44" fill="black"/>
    </mask>
  </defs>

  <rect width="256" height="256" rx="60" fill="#07090e"/>
  <circle cx="128" cy="128" r="112" fill="url(#mHalo)"/>

  <!-- The far side of the disk, bent up over the hole. -->
  <g mask="url(#mBehind)">
    <ellipse cx="128" cy="128" rx="92" ry="74" fill="none" stroke="url(#mRing)" stroke-width="5"/>
  </g>

  <!-- The shadow. -->
  <circle cx="128" cy="128" r="45" fill="#000000"/>

  <!-- The photon ring. -->
  <circle cx="128" cy="128" r="46" fill="none" stroke="url(#mRing)" stroke-width="2.6"/>
  <circle cx="128" cy="128" r="50" fill="none" stroke="#9af3e6" stroke-width="0.8" opacity="0.45"/>

  <!-- The near side, passing in front. -->
  <ellipse cx="128" cy="128" rx="112" ry="19" fill="none" stroke="url(#mDisk)" stroke-width="7"/>
  <ellipse cx="128" cy="128" rx="96" ry="14" fill="none" stroke="url(#mDisk)" stroke-width="3" opacity="0.55"/>
</svg>
