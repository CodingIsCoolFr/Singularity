<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Wisp">
  <title>Wisp</title>

  <defs>
    <linearGradient id="markEmber" x1="0.2" y1="1" x2="0.8" y2="0">
      <stop offset="0" stop-color="#a44f33"/>
      <stop offset="0.5" stop-color="#d97757"/>
      <stop offset="1" stop-color="#f0a98d"/>
    </linearGradient>

    <linearGradient id="markThread" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.25"/>
      <stop offset="0.45" stop-color="#d97757" stop-opacity="1"/>
      <stop offset="1" stop-color="#f0a98d" stop-opacity="0.35"/>
    </linearGradient>

    <radialGradient id="markGlow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- squircle, the same shape the server rail morphs into -->
  <rect width="256" height="256" rx="72" fill="#141413"/>
  <rect width="256" height="256" rx="72" fill="url(#markGlow)"/>

  <!-- the wisp: one thread of smoke, rising and turning -->
  <g fill="none" stroke="url(#markThread)" stroke-linecap="round">
    <path d="M128 212 C 168 166, 96 140, 136 96 C 166 62, 140 48, 158 28" stroke-width="13"/>
    <path d="M92 214 C 118 180, 78 158, 104 128" stroke-width="7" opacity="0.5"/>
  </g>

  <!-- the ember at its foot -->
  <circle cx="128" cy="216" r="11" fill="url(#markEmber)"/>
</svg>
