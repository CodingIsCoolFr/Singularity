<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Wisp - a Discord client in C++ with Qt 6">
  <title>Wisp</title>

  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ededed"/>
      <stop offset="0.5" stop-color="#9c9c9c"/>
      <stop offset="1" stop-color="#4a4a4a"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ededed" stop-opacity="0.1"/>
      <stop offset="0.45" stop-color="#ededed" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ededed" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.76" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="smoke" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0" stop-color="#ededed" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ededed" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="#0a0a0a"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- the wisp itself, a thread of smoke rising behind the wordmark -->
  <g fill="none" stroke="url(#smoke)" stroke-linecap="round">
    <path d="M652 340 C 700 268, 618 214, 676 150 C 720 102, 690 66, 724 22" stroke-width="2.5"/>
    <path d="M700 344 C 752 276, 676 226, 730 166 C 772 120, 744 84, 776 40" stroke-width="1.5" opacity="0.6"/>
    <path d="M610 346 C 650 286, 586 240, 632 190" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- a voice, drawn the way the client draws one -->
  <g fill="url(#steel)">
    <rect x="764" y="166" width="7" height="28" rx="3.5" opacity="0.3"/>
    <rect x="780" y="154" width="7" height="52" rx="3.5" opacity="0.4"/>
    <rect x="796" y="140" width="7" height="80" rx="3.5" opacity="0.5"/>
    <rect x="812" y="158" width="7" height="44" rx="3.5" opacity="0.45"/>
    <rect x="828" y="122" width="7" height="116" rx="3.5" opacity="0.65"/>
    <rect x="844" y="94" width="7" height="172" rx="3.5" opacity="0.8"/>
    <rect x="860" y="128" width="7" height="104" rx="3.5" opacity="0.65"/>
    <rect x="876" y="146" width="7" height="68" rx="3.5" opacity="0.55"/>
    <rect x="892" y="110" width="7" height="140" rx="3.5" opacity="0.75"/>
    <rect x="908" y="70" width="7" height="220" rx="3.5" opacity="0.95"/>
    <rect x="924" y="116" width="7" height="128" rx="3.5" opacity="0.8"/>
    <rect x="940" y="150" width="7" height="60" rx="3.5" opacity="0.55"/>
    <rect x="956" y="162" width="7" height="36" rx="3.5" opacity="0.4"/>
    <rect x="972" y="134" width="7" height="92" rx="3.5" opacity="0.6"/>
    <rect x="988" y="88" width="7" height="184" rx="3.5" opacity="0.85"/>
    <rect x="1004" y="52" width="7" height="256" rx="3.5"/>
    <rect x="1020" y="106" width="7" height="148" rx="3.5" opacity="0.8"/>
    <rect x="1036" y="140" width="7" height="80" rx="3.5" opacity="0.55"/>
    <rect x="1052" y="156" width="7" height="48" rx="3.5" opacity="0.45"/>
    <rect x="1068" y="124" width="7" height="112" rx="3.5" opacity="0.65"/>
    <rect x="1084" y="80" width="7" height="200" rx="3.5" opacity="0.8"/>
    <rect x="1100" y="112" width="7" height="136" rx="3.5" opacity="0.65"/>
    <rect x="1116" y="144" width="7" height="72" rx="3.5" opacity="0.5"/>
    <rect x="1132" y="160" width="7" height="40" rx="3.5" opacity="0.4"/>
    <rect x="1148" y="136" width="7" height="88" rx="3.5" opacity="0.45"/>
    <rect x="1164" y="152" width="7" height="56" rx="3.5" opacity="0.35"/>
    <rect x="1180" y="164" width="7" height="32" rx="3.5" opacity="0.26"/>
    <rect x="1196" y="170" width="7" height="20" rx="3.5" opacity="0.2"/>
  </g>

  <!-- accent rule -->
  <rect x="88" y="104" width="4" height="152" rx="2" fill="url(#fade)"/>

  <g font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif">
    <text x="124" y="176" font-size="98" font-weight="600" fill="#ededed" letter-spacing="-3">Wisp</text>
    <text x="128" y="222" font-size="24" font-weight="400" fill="#6b6b6b" letter-spacing="0.2">A Discord client in C++, built from scratch.</text>
    <text x="128" y="254" font-size="24" font-weight="400" fill="#6b6b6b" letter-spacing="0.2">Plugins compiled in. Voice encrypted end to end.</text>

    <g font-size="14" font-weight="500" letter-spacing="0.6">
      <rect x="128" y="286" width="74" height="30" rx="15" fill="none" stroke="#8f8f8f" stroke-opacity="0.5"/>
      <text x="165" y="306" fill="#a3a3a3" text-anchor="middle">C++20</text>

      <rect x="214" y="286" width="64" height="30" rx="15" fill="none" stroke="#8f8f8f" stroke-opacity="0.5"/>
      <text x="246" y="306" fill="#a3a3a3" text-anchor="middle">Qt 6</text>

      <rect x="290" y="286" width="108" height="30" rx="15" fill="none" stroke="#8f8f8f" stroke-opacity="0.5"/>
      <text x="344" y="306" fill="#a3a3a3" text-anchor="middle">DAVE E2EE</text>

      <rect x="410" y="286" width="88" height="30" rx="15" fill="none" stroke="#8f8f8f" stroke-opacity="0.5"/>
      <text x="454" y="306" fill="#a3a3a3" text-anchor="middle">Windows</text>
    </g>
  </g>
</svg>
