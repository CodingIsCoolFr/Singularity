<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Wisp - a Discord client in C++ with Qt 6">
  <title>Wisp</title>

  <defs>
    <!-- The disk: hot and white where it turns toward us, cooling away. -->
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7d8" stop-opacity="0.15"/>
      <stop offset="0.25" stop-color="#9af3e6" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#eef4fb"/>
      <stop offset="0.75" stop-color="#8aa4ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#6ee7d8" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="diskWarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0b35c" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#e0b35c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6b7a" stop-opacity="0"/>
    </linearGradient>

    <!-- Light bending round the back, seen over the top of the hole. -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7d8" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#8aa4ff" stop-opacity="0.35"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#6ee7d8" stop-opacity="0.32"/>
      <stop offset="0.8" stop-color="#6ee7d8" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#6ee7d8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="deep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#000000"/>
      <stop offset="0.93" stop-color="#000000"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7d8" stop-opacity="0.1"/>
      <stop offset="0.45" stop-color="#6ee7d8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8aa4ff" stop-opacity="0.25"/>
    </linearGradient>

    <!-- The hole itself hides the far side of the disk. -->
    <mask id="behind">
      <rect width="1280" height="400" fill="white"/>
      <circle cx="940" cy="200" r="86" fill="black"/>
    </mask>
  </defs>

  <rect width="1280" height="400" fill="#07090e"/>

  <!-- A scattering of distant stars, dimmed so they never compete. -->
  <g fill="#eef4fb">
    <circle cx="112" cy="58" r="1.1" opacity="0.5"/>
    <circle cx="286" cy="332" r="0.9" opacity="0.35"/>
    <circle cx="604" cy="76" r="1.3" opacity="0.45"/>
    <circle cx="512" cy="288" r="0.9" opacity="0.3"/>
    <circle cx="762" cy="46" r="1" opacity="0.4"/>
    <circle cx="1188" cy="112" r="1.2" opacity="0.5"/>
    <circle cx="1104" cy="336" r="0.9" opacity="0.35"/>
    <circle cx="1232" cy="242" r="1" opacity="0.3"/>
    <circle cx="846" cy="358" r="0.9" opacity="0.28"/>
    <circle cx="668" cy="196" r="0.8" opacity="0.25"/>
  </g>

  <g transform="translate(940 200)">
    <circle r="190" fill="url(#halo)"/>
  </g>

  <!-- The far side of the disk, arcing over the top, cut off by the hole. -->
  <g mask="url(#behind)">
    <ellipse cx="940" cy="200" rx="188" ry="150" fill="none" stroke="url(#ring)" stroke-width="7"/>
    <ellipse cx="940" cy="200" rx="188" ry="150" fill="none" stroke="url(#diskWarm)" stroke-width="16" opacity="0.5"/>
  </g>

  <!-- The shadow. Nothing comes back out of it. -->
  <circle cx="940" cy="200" r="88" fill="url(#deep)"/>

  <!-- The photon ring, hard against the edge. -->
  <circle cx="940" cy="200" r="90" fill="none" stroke="url(#ring)" stroke-width="3.5"/>
  <circle cx="940" cy="200" r="96" fill="none" stroke="#9af3e6" stroke-width="1" opacity="0.4"/>

  <!-- The near side of the disk, passing in front. -->
  <ellipse cx="940" cy="200" rx="238" ry="36" fill="none" stroke="url(#disk)" stroke-width="11"/>
  <ellipse cx="940" cy="200" rx="238" ry="36" fill="none" stroke="url(#diskWarm)" stroke-width="24" opacity="0.45"/>
  <ellipse cx="940" cy="200" rx="196" ry="26" fill="none" stroke="url(#disk)" stroke-width="4" opacity="0.6"/>

  <rect x="96" y="120" width="4" height="160" rx="2" fill="url(#rule)"/>

  <g font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif">
    <text x="132" y="196" font-size="104" font-weight="600" fill="#eef4fb" letter-spacing="-3">Wisp</text>
    <text x="136" y="244" font-size="24" fill="#6b768c">A Discord client in C++, built from scratch.</text>
    <text x="136" y="276" font-size="24" fill="#6b768c">Voice encrypted end to end. Plugins compiled in.</text>

    <g font-size="14" font-weight="500" letter-spacing="0.6">
      <rect x="136" y="308" width="74" height="30" rx="15" fill="none" stroke="#6ee7d8" stroke-opacity="0.4"/>
      <text x="173" y="328" fill="#6ee7d8" text-anchor="middle">C++20</text>

      <rect x="222" y="308" width="64" height="30" rx="15" fill="none" stroke="#6ee7d8" stroke-opacity="0.4"/>
      <text x="254" y="328" fill="#6ee7d8" text-anchor="middle">Qt 6</text>

      <rect x="298" y="308" width="108" height="30" rx="15" fill="none" stroke="#6ee7d8" stroke-opacity="0.4"/>
      <text x="352" y="328" fill="#6ee7d8" text-anchor="middle">DAVE E2EE</text>

      <rect x="418" y="308" width="88" height="30" rx="15" fill="none" stroke="#6ee7d8" stroke-opacity="0.4"/>
      <text x="462" y="328" fill="#6ee7d8" text-anchor="middle">Windows</text>
    </g>
  </g>
</svg>
